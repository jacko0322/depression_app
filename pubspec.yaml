name: flutter_projects
description: "A new Flutter project."
# 版本號和環境設定
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# 正確的依賴配置格式
dependencies:
  flutter:
    sdk: flutter

  # 現有的Firebase依賴
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  google_sign_in: ^6.1.6

  # 新增的HTTP依賴 - 注意縮進和格式
  http: ^1.1.0

  # 其他UI和功能依賴
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Flutter配置
flutter:
  uses-material-design: true
