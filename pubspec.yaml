name: depression_app
description: 心靈陪伴應用程式 - 支援自訂背景顏色

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase 相關套件
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0

  # Google 登入
  google_sign_in: ^6.1.5

  # HTTP 請求
  http: ^1.1.0

  # 本地儲存 (用於儲存顏色偏好設定)
  shared_preferences: ^2.2.2

  # UI 相關
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 如果有需要的資源檔案，可以在這裡加入
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # 字體設定
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700